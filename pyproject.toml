[project]
name = "kirby-campaign"
version = "0.1.0"
description = "Teams, rosters and campaign entities for the Kirby HERO System platform"
requires-python = ">=3.12"
license = {text = "PolyForm Noncommercial License 1.0.0"}
readme = "README.md"
authors = [{name = "PeterB"}]
# One dependency, and its DIRECTION is the design. kirby-campaign sits ABOVE
# kirby-combat: a Team becomes a `Side`, and `Side` lives in the engine
# because a free-for-all in an alley has sides and no campaign at all.
#
# The reverse must never happen. If kirby-combat imported this package,
# resolving an attack would depend on knowing what a campaign is, dragging
# rosters, narrative prose and eventually tenancy behind every roll.
# `tests/test_independence.py` is what keeps that true.
#
# No storage, so this is still testable in memory with nothing running.
dependencies = ["kirby-combat>=0.16.0"]

[project.urls]
Repository = "https://github.com/pdbethke/kirby-campaign"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kirby_campaign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

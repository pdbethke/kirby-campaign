name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Run tests
        # Runs offline with no fixtures, no database and no configuration.
        # If this suite ever needs an environment variable, something that is
        # not the entity layer has moved into the package.
        #
        # `test_independence.py` is the one worth watching: it asserts by AST
        # that the dependency runs ONE way. This package imports kirby-combat
        # (a Team becomes a `Side`); kirby-combat must never import this one.
        run: pytest -q --tb=short --cov=kirby_campaign --cov-report=term-missing

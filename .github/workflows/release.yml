name: Release

# Publishes to PyPI when a version tag is pushed, and NOT otherwise.
#
# Authentication is an API token in the `PYPI_API_TOKEN` secret, matching
# kirby-cost, kirby-combat, kirby-terrain and kirby-world. Trusted Publishing (OIDC) would be better and
# is NOT used, for a specific reason worth writing down: registering a trusted
# publisher is a pypi.org web-UI action, and the account's 2FA was lost on
# 2026-09-04. API tokens keep working when 2FA is lost; a web session does not.
#
# Restore Trusted Publishing once the account is recoverable: register the
# publisher (owner/repo/`release.yml`/environment `pypi`), add
# `permissions: id-token: write` to the publish job, and drop `password:`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and its test deps
        run: pip install -e .[dev]

      - name: Run the test suite
        run: pytest -q --tb=short

      - name: Build the distribution
        run: |
          python -m pip install --upgrade build
          rm -rf dist build *.egg-info
          python -m build

      - name: Release guards
        run: python scripts/check_release.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A version published by hand leaves the tag to be added later;
          # without this a retroactive tag re-uploads an existing version
          # and the job fails on it.
          skip-existing: true
